<div class="min-h-screen bg-[#eef4ff] flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-7xl overflow-hidden rounded-[32px] bg-white shadow-[0_20px_60px_rgba(37,99,235,0.12)]">
    <div class="grid min-h-[760px] grid-cols-1 lg:grid-cols-2">
      
      <!-- LEFT PANEL -->
      <div class="relative hidden lg:flex flex-col justify-between overflow-hidden bg-[#dfeaff] p-12">
        
        <!-- shapes -->
        <div class="absolute -bottom-16 -left-16 h-72 w-72 rounded-full bg-white/20"></div>
        <div class="absolute bottom-10 left-10 h-56 w-56 rounded-full border-[30px] border-white/10"></div>

        <!-- TOP -->
        <div class="relative z-10">
          <img
            src="/images/dawini-logo.png"
            alt="Dawini logo"
            class="mb-10 h-24 w-24 object-contain"
          />

          <h2 class="max-w-md text-[20px] font-semibold leading-[1.8] text-slate-900">
            We at Dawini are dedicated to providing trusted care and improving lives every day.
          </h2>
        </div>

        <!-- BOTTOM (CORRIGÉ) -->
        <div class="relative z-10 flex items-end justify-center pt-10">
          <div class="relative h-[300px] w-full flex items-center justify-center">

            <!-- light shadow -->
            <div class="absolute bottom-12 w-40 h-6 rounded-full bg-blue-400/20 blur-2xl"></div>

            <!-- stethoscope -->
            <img
              src="/images/stethoscope.png"
              alt="Medical illustration"
              class="absolute bottom-16 left-[-40px] w-[420px] object-contain drop-shadow-[0_20px_40px_rgba(37,99,235,0.25)]"
            />

          </div>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="flex items-center justify-center bg-white px-6 py-10 sm:px-10 lg:px-14">
        <div class="w-full max-w-xl">
          
          <div class="mb-8">
            <h1 class="mb-2 text-5xl font-bold tracking-tight text-slate-900">
              Sign In
            </h1>
          </div>

          <div
            *ngIf="errorMessage"
            class="mb-4 rounded-xl border border-red-100 bg-red-50 px-4 py-3 text-sm text-red-700"
          >
            {{ errorMessage }}
          </div>

          <!-- GOOGLE BUTTON -->
          <div class="flex justify-center">
            <button
              type="button"
              (click)="signInWithGoogle()"
              class="inline-flex h-16 w-full max-w-sm items-center justify-center gap-3 rounded-2xl bg-[#edf4ff] px-7 text-base font-medium text-slate-700 transition hover:bg-[#e2edff] hover:text-slate-900"
            >
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M18.7511 10.1944C18.7511 9.47495 18.6915 8.94995 18.5626 8.40552H10.1797V11.6527H15.1003C15.0011 12.4597 14.4654 13.675 13.2749 14.4916L13.2582 14.6003L15.9087 16.6126L16.0924 16.6305C17.7788 15.1041 18.7511 12.8583 18.7511 10.1944Z" fill="#4285F4"/>
                <path d="M10.1788 18.75C12.5895 18.75 14.6133 17.9722 16.0915 16.6305L13.274 14.4916C12.5201 15.0068 11.5081 15.3666 10.1788 15.3666C7.81773 15.3666 5.81379 13.8402 5.09944 11.7305L4.99473 11.7392L2.23868 13.8295L2.20264 13.9277C3.67087 16.786 6.68674 18.75 10.1788 18.75Z" fill="#34A853"/>
                <path d="M5.10014 11.7305C4.91165 11.186 4.80257 10.6027 4.80257 9.99992C4.80257 9.3971 4.91165 8.81379 5.09022 8.26935L5.08523 8.1534L2.29464 6.02954L2.20333 6.0721C1.5982 7.25823 1.25098 8.5902 1.25098 9.99992C1.25098 11.4096 1.5982 12.7415 2.20333 13.9277L5.10014 11.7305Z" fill="#FBBC05"/>
                <path d="M10.1789 4.63331C11.8554 4.63331 12.9864 5.34303 13.6312 5.93612L16.1511 3.525C14.6035 2.11528 12.5895 1.25 10.1789 1.25C6.68676 1.25 3.67088 3.21387 2.20264 6.07218L5.08953 8.26943C5.81381 6.15972 7.81776 4.63331 10.1789 4.63331Z" fill="#EB4335"/>
              </svg>

              Sign in with Google
            </button>
          </div>

          <!-- Divider -->
          <div class="relative py-7">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-slate-200"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="bg-white px-6 text-slate-400">Or</span>
            </div>
          </div>

          <!-- FORM -->
          <form (ngSubmit)="onSignIn()" class="space-y-6">

            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-800">
                Email <span class="text-red-500">*</span>
              </label>
              <input
                [(ngModel)]="email"
                name="email"
                type="email"
                placeholder="info@gmail.com"
                class="h-16 w-full rounded-2xl border border-slate-200 px-5 focus:border-blue-400 focus:ring-4 focus:ring-blue-100"
                required
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold text-slate-800">
                Password <span class="text-red-500">*</span>
              </label>

              <div class="relative">
                <input
                  [(ngModel)]="password"
                  name="password"
                  [type]="showPassword ? 'text' : 'password'"
                  placeholder="Enter your password"
                  class="h-16 w-full rounded-2xl border border-slate-200 px-5 pr-14 focus:border-blue-400 focus:ring-4 focus:ring-blue-100"
                  required
                />

                <button
                  type="button"
                  (click)="togglePasswordVisibility()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"
                >
                  👁
                </button>
              </div>
            </div>

            <div class="flex items-center justify-between">
              <label class="flex items-center gap-3 text-sm text-slate-700">
                <input [(ngModel)]="isChecked" name="keepMeLoggedIn" type="checkbox" />
                Keep me logged in
              </label>

              <a routerLink="/reset-password" class="text-sm text-blue-600">
                Forgot password?
              </a>
            </div>

            <button
              type="submit"
              [disabled]="loading"
              class="h-16 w-full rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 text-lg font-semibold text-white shadow-lg hover:from-blue-700 hover:to-blue-600"
            >
              {{ loading ? 'Signing in...' : 'Sign in' }}
            </button>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>
