<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white pt-4">

  <!-- header -->
  <div class="flex flex-col gap-4 px-6 mb-4 sm:flex-row sm:items-center sm:justify-between">

    <h3 class="text-lg font-semibold text-gray-800">
      Users List
    </h3>

    <!-- search -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center">

      <div class="relative">

        <input
          type="text"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Search user..."
          class="h-[42px] w-full rounded-lg border border-gray-300 bg-transparent py-2 pl-4 pr-4 text-sm text-gray-800 focus:border-blue-300 focus:outline-none focus:ring-2 focus:ring-blue-500/10 xl:w-[300px]"
        />

      </div>

      <button
        class="px-4 py-2 text-sm border rounded-lg hover:bg-gray-50">
        Add User
      </button>

    </div>

  </div>


  <!-- table -->
  <div class="overflow-x-auto">

    <table class="min-w-full">

      <thead class="bg-gray-50 border-y">

        <tr>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            ID
          </th>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            Name
          </th>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            Email
          </th>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            Role
          </th>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            Status
          </th>

          <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">
            Action
          </th>

        </tr>

      </thead>



      <tbody>

        <tr
          *ngFor="let row of currentItems"
          class="border-b hover:bg-gray-50"
        >

          <td class="px-4 py-3">
            {{ row.id }}
          </td>

          <td class="px-4 py-3">
            {{ row.user.name }}
          </td>

          <td class="px-4 py-3">
            {{ row.user.email }}
          </td>

          <td class="px-4 py-3">
            {{ row.product.name }}
          </td>


          <!-- status -->
          <td class="px-4 py-3">

            <span
              class="px-2 py-1 text-xs font-medium rounded-full"
              [ngClass]="{

                'bg-green-100 text-green-700':
                row.status.type === 'Active',

                'bg-yellow-100 text-yellow-700':
                row.status.type === 'Pending',

                'bg-red-100 text-red-700':
                row.status.type === 'Cancel'

              }"
            >

              {{ row.status.type }}

            </span>

          </td>



          <!-- actions -->
          <td class="px-4 py-3">

            <button
              class="text-blue-600 hover:underline text-sm mr-2">

              edit

            </button>

            <button
              class="text-red-600 hover:underline text-sm">

              delete

            </button>

          </td>


        </tr>

      </tbody>


    </table>

  </div>



  <!-- pagination -->
  <div class="px-6 py-4 border-t border-gray-200">

    <div class="flex items-center justify-between">


      <button
        class="px-3 py-2 text-sm border rounded-lg disabled:opacity-50"
        (click)="goToPage(currentPage - 1)"
        [disabled]="currentPage === 1"
      >
        Previous
      </button>



      <ul class="hidden items-center gap-1 sm:flex">

        <li *ngFor="let page of pageNumbers">

          <button
            (click)="goToPage(page)"

            class="flex h-10 w-10 items-center justify-center rounded-lg text-sm font-medium"

            [ngClass]="{

              'bg-blue-600 text-white':
              currentPage === page,

              'text-gray-700 hover:bg-blue-50':
              currentPage !== page

            }"
          >

            {{ page }}

          </button>

        </li>

      </ul>



      <button
        class="px-3 py-2 text-sm border rounded-lg disabled:opacity-50"
        (click)="goToPage(currentPage + 1)"
        [disabled]="currentPage === totalPages"
      >
        Next
      </button>


    </div>

  </div>


</div>
