<div class="min-h-screen bg-[#eef4ff] flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-[32px] bg-white p-8 shadow-[0_20px_60px_rgba(37,99,235,0.12)]">
    <div class="text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600">Security</p>
      <h1 class="mt-3 text-3xl font-black text-slate-900">Two-Factor Verification</h1>
      <p class="mt-3 text-sm text-slate-500">
        Open Google Authenticator and enter the 6-digit code.
      </p>
    </div>

    <div class="mt-8">
      <input
        [(ngModel)]="code"
        maxlength="6"
        class="h-14 w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 text-center text-xl tracking-[0.35em] outline-none transition focus:border-blue-400 focus:bg-white focus:ring-4 focus:ring-blue-100"
        placeholder="000000"
      />
    </div>

    <div *ngIf="errorMessage" class="mt-4 rounded-2xl bg-red-50 px-4 py-3 text-sm font-medium text-red-600">
      {{ errorMessage }}
    </div>

    <button
      (click)="verifyCode()"
      [disabled]="loading || !code.trim()"
      class="mt-6 h-14 w-full rounded-2xl bg-gradient-to-r from-blue-600 to-blue-500 text-base font-bold text-white shadow-[0_12px_30px_rgba(37,99,235,0.25)] transition hover:from-blue-700 hover:to-blue-600 disabled:opacity-40"
    >
      {{ loading ? 'Verifying...' : 'Verify Code' }}
    </button>
  </div>
</div>
