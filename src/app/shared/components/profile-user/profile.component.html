<div class="p-5 border border-gray-200 rounded-2xl lg:p-6" *ngIf="user">
  <div class="flex flex-col gap-5 xl:flex-row xl:items-center xl:justify-between">
    <div class="flex flex-col items-center w-full gap-6 xl:flex-row">
      <div class="relative w-24 h-24 overflow-hidden border border-gray-200 rounded-full">
        <img
          [src]="'http://localhost:8020' + user.imageUrl"
          alt="user"
          class="w-full h-full object-cover"
        />

        <label
          class="absolute bottom-0 right-0 bg-blue-600 text-white text-xs px-2 py-1 rounded-full cursor-pointer"
        >
          Edit
          <input type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)" />
        </label>
      </div>

      <div>
        <h4 class="mb-2 text-lg font-semibold text-gray-800">
          {{ user.firstName }} {{ user.lastName }}
        </h4>

        <p class="text-sm text-gray-500">
          {{ user.role }}
        </p>

        <p class="text-sm text-gray-500">
          {{ user.email }}
        </p>
      </div>
    </div>

    <button
      (click)="openModal()"
      class="flex w-full items-center justify-center gap-2 rounded-full border border-gray-300 bg-white px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 lg:inline-flex lg:w-auto"
    >
      Edit profile
    </button>
  </div>

  <div class="mt-8 grid grid-cols-1 gap-4 lg:grid-cols-2">
    <div>
      <p class="mb-2 text-xs text-gray-500">Username</p>
      <p class="text-sm font-medium text-gray-800">{{ user.username }}</p>
    </div>

    <div>
      <p class="mb-2 text-xs text-gray-500">Phone</p>
      <p class="text-sm font-medium text-gray-800">{{ user.phoneNumber || '-' }}</p>
    </div>

    <div>
      <p class="mb-2 text-xs text-gray-500">First Name</p>
      <p class="text-sm font-medium text-gray-800">{{ user.firstName || '-' }}</p>
    </div>

    <div>
      <p class="mb-2 text-xs text-gray-500">Last Name</p>
      <p class="text-sm font-medium text-gray-800">{{ user.lastName || '-' }}</p>
    </div>

    <div>
      <p class="mb-2 text-xs text-gray-500">Email</p>
      <p class="text-sm font-medium text-gray-800">{{ user.email }}</p>
    </div>

    <div>
      <p class="mb-2 text-xs text-gray-500">Role</p>
      <p class="text-sm font-medium text-gray-800">{{ user.role }}</p>
    </div>
  </div>
</div>

<div *ngIf="isOpen" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-2xl">
    <h3 class="text-xl font-semibold mb-4">Update profile</h3>

    <form [formGroup]="form" (ngSubmit)="handleSave()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block mb-2 text-sm">Username</label>
        <input type="text" formControlName="username" class="w-full border rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block mb-2 text-sm">Phone</label>
        <input type="text" formControlName="phoneNumber" class="w-full border rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block mb-2 text-sm">First Name</label>
        <input type="text" formControlName="firstName" class="w-full border rounded-lg px-3 py-2" />
      </div>

      <div>
        <label class="block mb-2 text-sm">Last Name</label>
        <input type="text" formControlName="lastName" class="w-full border rounded-lg px-3 py-2" />
      </div>

      <div class="md:col-span-2 flex justify-end gap-3 mt-4">
        <button type="button" (click)="closeModal()" class="px-4 py-2 border rounded-lg">
          Close
        </button>
        <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded-lg">
          Update
        </button>
      </div>
    </form>
  </div>
</div>
